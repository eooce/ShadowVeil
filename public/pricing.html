<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>定价 — ShadowVeil</title>
  <meta name="description" content="ShadowVeil 定价：当前阶段全部功能免费，Pro 即将到来。" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'] },
          colors: { base: 'var(--bg-base)', elevated: 'var(--bg-elevated)', muted: 'var(--text-muted)', primary: 'var(--text-primary)' },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/css/tailwind.css" />
  <link rel="stylesheet" href="/css/custom.css" />
</head>

<body class="min-h-screen font-sans antialiased text-primary">
  <div class="bg-aurora" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="bg-grid"></div>
  </div>

  <header class="site-nav">
    <div class="nav-inner">
      <a href="/" class="brand" aria-label="ShadowVeil 首页">
        <img src="/assets/logo.svg" alt="" width="30" height="30" class="brand-logo" />
        <span class="brand-name">ShadowVeil</span>
      </a>
      <nav class="nav-links" aria-label="主导航">
        <a href="/" class="nav-link">混淆器</a>
        <a href="/docs" class="nav-link">API 文档</a>
        <a href="/pricing" class="nav-link is-active">定价</a>
        <a href="/about" class="nav-link">关于</a>
      </nav>
      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="切换明暗主题">
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="relative z-10 mx-auto w-full max-w-[1400px] px-4 sm:px-6 lg:px-8">
    <section class="pricing" aria-labelledby="pricing-title">
      <h1 id="pricing-title" class="section-title">定价</h1>
      <p class="section-sub">当前阶段全部功能免费开放。以下为规划中的方案预览。</p>

      <div class="pricing-grid">
        <div class="glass-card pricing-card">
          <h3>Free</h3>
          <div class="pricing-price"><span class="gradient-text">¥0</span><span class="pricing-period">/ 永久</span></div>
          <ul class="pricing-list">
            <li>网页端无限次在线混淆</li>
            <li>匿名 API：10 次 / 分钟</li>
            <li>JavaScript · Python · Shell</li>
          </ul>
          <a href="/" class="mini-btn pricing-btn">开始使用</a>
        </div>

        <div class="glass-card pricing-card is-featured">
          <span class="pricing-tag">Coming soon</span>
          <h3>Pro</h3>
          <div class="pricing-price"><span class="gradient-text">待定</span></div>
          <ul class="pricing-list">
            <li>更高 API 配额（100 次 / 分钟）</li>
            <li>批量混淆与优先队列</li>
            <li>私有化部署支持</li>
          </ul>
          <a href="/docs" class="mini-btn pricing-btn">查看 API</a>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <p>© 2026 ShadowVeil · 让代码隐入暗影</p>
      <nav aria-label="页脚链接">
        <a href="/">混淆器</a>
        <a href="/docs">API 文档</a>
        <a href="https://github.com/eooce/ShadowVeil" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
    </footer>
  </main>

  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <script src="/js/app.js"></script>
</body>
</html>
